; ESP32-2432S028 ("Cheap Yellow Display") - ILI9341 320x240
[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_ldf_mode = deep+

lib_deps =
    lvgl/lvgl@^9.2.2
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.2.0
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

build_flags =
    ; ---------- LVGL (niente lv_conf.h: configurazione via flag) ----------
    -D LV_CONF_SKIP
    -D LV_COLOR_DEPTH=16
    -D LV_USE_TFT_ESPI=1
    -D LV_MEM_SIZE=65536U
    -D LV_FONT_UNSCII_8=1
    -D LV_FONT_UNSCII_16=1

    ; ---------- TFT_eSPI (pin del CYD) ----------
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1          ; se i colori sono sbagliati prova ST7789_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D USE_HSPI_PORT=1
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
